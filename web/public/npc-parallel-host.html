<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>梨园 · 众生侧写原版设置</title>
  <link rel="stylesheet" href="/npc-parallel/host.css">
</head>
<body data-view="manager">
  <header id="npcp-host-banner" role="status" aria-live="polite">
    <strong>众生侧写 · 梨园兼容宿主</strong>
    <span id="npcp-host-message">正在载入原版设置…</span>
  </header>
  <details id="npcp-host-help"><summary>使用说明与宿主边界</summary></details>
  <main>
    <div id="npcp-host-canvas" aria-label="众生侧写原版设置画布"></div>
    <div id="status" role="status">正在加载原始插件…</div>
    <div id="extensions_settings"></div>
    <div id="extensions_settings2"></div>
    <div id="chat"></div>
    <div id="send_form" hidden><textarea id="send_textarea"></textarea><button id="send_but" type="button">发送</button></div>
    <div id="character_popup" hidden></div>
    <div id="movingUI" hidden></div>
  </main>
  <script src="/npc-parallel/vendor/jquery.js"></script>
  <script src="/npc-parallel/vendor/jquery-ui.js"></script>
  <script src="/npc-parallel/vendor/jquery-touch-punch.js"></script>
  <script src="/npc-parallel/vendor/toastr.js"></script>
  <script type="module" src="/npc-parallel/host.js"></script>
</body>
</html>
