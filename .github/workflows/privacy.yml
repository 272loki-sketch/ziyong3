name: privacy

on:
  push:
  pull_request_target:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only base tools run. Candidate checkout is data, with no install/build/scripts.
      # A first push (zero before) has no trusted baseline and deliberately fails.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: Trusted base scans candidate objects and introduced commits
        working-directory: candidate
        run: node ../trusted/scripts/check-privacy-ci.mjs
      - name: Trusted base checks public documentation links
        working-directory: candidate
        run: node ../trusted/scripts/check-docs.mjs --root .
