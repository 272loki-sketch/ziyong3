server {
    listen 8788 ssl;
    http2 on;
    server_name rp.example.com;

    ssl_certificate /etc/letsencrypt/live/rp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LIYUAN_SSL:10m;
    ssl_session_timeout 10m;

    auth_basic "Liyuan";
    auth_basic_user_file /etc/nginx/htpasswd/liyuan;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:7620;
        proxy_http_version 1.1;
        # Preserve the browser authority, including its non-default port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    access_log /var/log/nginx/liyuan-8788.log;
    error_log /var/log/nginx/liyuan-8788.error.log;
}
